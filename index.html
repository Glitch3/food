<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="zouzou">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>zouzou's food lister</title>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabbar">
      <button data-action="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></button>
      <button data-action="tab" data-tab="meals"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>My Meals</span></button>
      <button data-action="add" class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
      <button data-action="tab" data-tab="game"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="4"/><path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/></svg><span>Play</span></button>
      <button data-action="tab" data-tab="about"><svg viewBox="0 0 24 24"><path d="M4 4l4 4h8l4-4v13a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M9 13h.01M15 13h.01"/></svg><span>Zouzou</span></button>
    </nav>
  </div>
  <div id="sheet" hidden></div>
  <div id="mascot">
    <div id="bubble" hidden></div>
    <button id="cat" data-action="pet" aria-label="pet zouzou"><img src="cat.png" alt="pixel art of zouzou the cat" width="64" height="64"></button>
  </div>
  <canvas id="fx"></canvas>
  <div id="toast" hidden></div>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
