<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="plated">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>plated</title>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabbar">
      <button data-action="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></button>
      <button data-action="tab" data-tab="meals"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>My Meals</span></button>
      <button data-action="add" class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
      <button data-action="tab" data-tab="want"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Want to Try</span></button>
      <button data-action="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span></button>
    </nav>
  </div>
  <div id="sheet" hidden></div>
  <div id="mascot">
    <div id="bubble" hidden></div>
    <button id="cat" data-action="pet" aria-label="Pet the cat"><img src="cat.png" alt="Pixel art cat" width="64" height="64"></button>
  </div>
  <canvas id="fx"></canvas>
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
